name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      # Only tracked files, so directories that do not exist yet are fine.
      - name: Check formatting
        run: |
          git ls-files -z -- include src tests bench python \
            | grep -z -E '\.(hpp|cpp)$' \
            | xargs -0 -r clang-format-18 --dry-run --Werror

  cpp:
    name: C++ (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [dev, release]
        include:
          # ThreadSanitizer build, gcc only.
          - compiler: gcc
            preset: tsan
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            # libclang-rt provides the ASan/UBSan runtimes for clang.
            sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev
          fi

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang-18" >> "$GITHUB_ENV"
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      # The 24.04 runner kernel uses 32 bits of mmap ASLR entropy, which makes
      # ASan/TSan abort at startup ("unexpected memory mapping"). 28 is safe.
      - name: Reduce ASLR entropy for sanitizers
        if: matrix.preset != 'release'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Builds the extension with scikit-build-core and installs test extras.
      - name: Build and install
        run: pip install -v ".[test]"

      - name: Run tests
        run: pytest python/tests -q

      # Small end-to-end run to make sure the benchmark harness still works.
      - name: Benchmark smoke test
        run: >
          python -m benchmarks.run
          --engine annex-flat --dataset synthetic
          --n 2000 --dim 32 --queries 100 --k 10
